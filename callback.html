<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herald – propojení účtu</title><link rel="stylesheet" href="style.css"></head><body><main>
<h1>Propojení účtu</h1>
<div class="box" id="out"><p class="muted">Načítám…</p></div>
<script>
var p=new URLSearchParams(location.search),c=p.get("code"),e=p.get("error"),o=document.getElementById("out");
if(c){o.innerHTML='<p>Povolení proběhlo. Zkopírujte tento kód a vložte ho podle návodu (platí jen pár minut):</p><p><code id="c"></code></p><p><button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent);this.textContent=\'Zkopírováno\'">Zkopírovat</button></p>';document.getElementById("c").textContent=c;}
else if(e){o.innerHTML='<p>Povolení se nepovedlo: <code></code></p>';o.querySelector("code").textContent=e+" "+(p.get("error_description")||"");}
else{o.innerHTML='<p class="muted">Tahle stránka slouží jen pro jednorázové propojení účtu s aplikací Herald.</p>';}
</script>
</main></body></html>
